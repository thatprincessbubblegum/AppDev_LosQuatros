<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Aerostar Travel & Tours | Visa Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body {
      background: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .services-card {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 24px;
      padding: 40px;
      max-width: 1000px;
      margin: auto;
    }

    .filter-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .filter-select,
    .form-control-custom {
      background: #f0f0f0;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      width: 100%;
    }

    .destination-name {
      font-size: 48px;
      font-weight: bold;
    }

    .visa-badge {
      font-size: 14px;
      color: #198754;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .applicant-block {
      border-left: 4px solid #0d6efd;
      background: #fdfdfd;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #333;
    }

    .site-footer {
      background: #f8f8f8;
      border-top: 1px solid #ddd;
      padding: 20px 40px;
      font-size: 13px;
      margin-top: 50px;

      .header-banner {
        height: 300px;
        border-radius: 16px;
        background-size: cover;
        background-position: center;
        position: relative;
        overflow: hidden;
        transition: background-image 0.5s ease-in-out;
        /* Smooth fade effect */
      }

      .header-overlay {
        background: linear-gradient(to right, rgba(0, 0, 0, 0.7), transparent);
        height: 100%;
        width: 100%;
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: white;
      }

      .visa-badge-white {
        font-size: 18px;
        /* Larger badge text */
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        background: rgba(25, 135, 84, 0.8);
        /* Semi-transparent green background */
        padding: 8px 15px;
        border-radius: 50px;
        width: fit-content;
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-light border-bottom">
    <div class="container">
      <a class="navbar-brand" href="#">Logo</a>

      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="destinationsandpackages.html">Destinations & Packages</a></li>
          <li class="nav-item"><a class="nav-link active" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-3">
            <a class="btn btn-dark" href="book.html">Book</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="services-card shadow-sm">
      <form id="visaForm">

        <!-- TOP FILTERS -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="filter-label">Destination Country</div>
            <select class="filter-select" id="entryCountry" required onchange="updateUI()">
              <option value="" disabled selected>Select Destination</option>
              <option value="China" data-flag="🇨🇳">China Visa</option>
              <option value="South Korea" data-flag="🇰🇷">Korea Visa</option>
              <option value="Japan" data-flag="🇯🇵">Japan Visa</option>
              <option value="USA" data-flag="🇺🇸">US Visa</option>
              <option value="Australia" data-flag="🇦🇺">Australian Visa</option>
              <option value="Schengen" data-flag="🇪🇺">Schengen (Europe) Visa</option>
              <option value="UK" data-flag="🇬🇧">UK Visa</option>
              <option value="Dubai" data-flag="🇦🇪">Dubai Visa</option>
              <option value="Canada" data-flag="🇨🇦">Canadian Visa</option>
              <option value="New Zealand" data-flag="🇳🇿">New Zealand Visa</option>
            </select>
          </div>

          <div class="col-md-4">
            <div class="filter-label">Date of Entry</div>
            <input type="date" id="entryDate" class="filter-select" required>
          </div>

          <div class="col-md-4">
            <div class="filter-label">Number of Applicants</div>
            <input type="number" id="numApplicants" class="filter-select" min="1" placeholder="e.g. 1" required>
          </div>
        </div>

        <!-- DESTINATION HEADER WITH BACKGROUND -->
        <div id="destHeader" class="header-banner d-none mb-4">
          <div class="header-overlay">
            <div class="d-flex align-items-center gap-3">
              <span class="destination-name" id="displayDestName">Destination</span>
              <span style="font-size: 32px;" id="displayFlag"></span>
            </div>
            <div class="visa-badge-white">
              <i class="bi bi-check-circle-fill"></i>
              Visa Processing Service Available
            </div>
          </div>
        </div>

        <hr class="mb-4">

        <!-- DYNAMIC APPLICANTS -->
        <div id="applicantsContainer"></div>

        <!-- SUBMIT -->
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-primary px-5 py-2 fw-bold" style="border-radius: 8px;">
            Submit Inquiry
          </button>
        </div>

      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="d-flex justify-content-between align-items-center container">
      <div class="fw-bold">Aerostar Travel & Tours</div>
      <div class="text-muted">Copyright @ Aerostar2026</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="visaform.js"></script>
</body>

</html>
